<!-- app/templates/admin/nuevo_personal.html -->
{% extends "base.html" %}
{% block titulo %}Nueva cuenta de personal{% endblock %}
{% block contenido %}
<div class="d-flex align-items-center gap-2 mb-4">
    <a href="{{ url_for('admin.personal') }}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
    <h4 class="mb-0">Nueva cuenta de personal</h4>
</div>

<form method="POST">
    {% include 'admin/_form_personal.html' %}
    <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Crear cuenta</button>
        <a href="{{ url_for('admin.personal') }}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
