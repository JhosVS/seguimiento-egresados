<!-- app/templates/errores/404.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada — Egresados UNDAC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', sans-serif; background: #f4f6f9; text-align: center;
        }
        .box { max-width: 420px; padding: 24px; }
        .codigo { font-size: 5rem; font-weight: 800; color: #003876; line-height: 1; }
        .icono { font-size: 2.2rem; color: #94a3b8; margin-bottom: 12px; }
        h2 { font-size: 1.2rem; color: #1e293b; margin: 12px 0 6px; }
        p { color: #64748b; font-size: .9rem; margin-bottom: 24px; }
        .btn-volver {
            background: #003876; color: #fff; border: none; border-radius: 8px;
            padding: 10px 24px; font-weight: 600; font-size: .9rem;
            text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-volver:hover { background: #002a5c; color: #fff; }
    </style>
</head>
<body>
    <div class="box">
        <div class="icono"><i class="bi bi-signpost-split"></i></div>
        <div class="codigo">404</div>
        <h2>Página no encontrada</h2>
        <p>La página que buscas no existe o fue movida.</p>
        <a href="{{ url_for('public.index') }}" class="btn-volver">
            <i class="bi bi-house-door"></i>Volver al inicio
        </a>
    </div>
</body>
</html>
