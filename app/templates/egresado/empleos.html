{% extends "base.html" %}
{% block titulo %}Experiencia laboral{% endblock %}

{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0"><i class="bi bi-briefcase me-2"></i>Experiencia laboral</h4>
    <button type="button" class="btn btn-primary btn-sm"
            hx-get="{{ url_for('egresado.empleos_tabla', nuevo=1) }}"
            hx-target="#zona-empleos" hx-swap="innerHTML">
        <i class="bi bi-plus-lg me-1"></i>Nuevo
    </button>
</div>

<!-- Todo lo que cambia vive aquí dentro; hx-target lo heredan los botones de la tabla -->
<div id="zona-empleos" hx-target="#zona-empleos" hx-swap="innerHTML">
    {% include 'egresado/_tabla_empleos.html' %}
</div>

{% endblock %}
