{% extends "base.html" %}
{% block titulo %}Registrar Empleo{% endblock %}

{% block contenido %}
<div class="container py-3" style="max-width: 750px;">

    <!-- Encabezado con botón para volver a la lista cuando se termine -->
    <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom">
        <h4 class="mb-0 fw-bold"><i class="bi bi-briefcase me-2 text-primary"></i>Registrar Empleo</h4>
        <a href="{{ url_for('egresado.empleos') }}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Ver mis empleos
        </a>
    </div>

    <!-- Formulario -->
    <form method="POST" action="{{ url_for('egresado.nuevo_empleo') }}" class="card shadow-sm p-4">
        
        <div class="row g-3">
            <div class="col-md-7">
                <label class="form-label small fw-semibold">Empresa / Institución <span class="text-danger">*</span></label>
                <input type="text" name="empresa_nombre" class="form-control" required placeholder="Ej: Tech Solutions">
            </div>
            
            <div class="col-md-5">
                <label class="form-label small fw-semibold">Sector Laboral</label>
                <select name="id_sector" class="form-select">
                    <option value="">-- Seleccionar --</option>
                    {% for s in sectores %}
                        <option value="{{ s.id_sector }}">{{ s.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-7">
                <label class="form-label small fw-semibold">Cargo / Puesto <span class="text-danger">*</span></label>
                <input type="text" name="cargo" class="form-control" required placeholder="Ej: Analista de Sistemas">
            </div>

            <div class="col-md-5">
                <label class="form-label small fw-semibold">Tipo de Contrato</label>
                <select name="tipo_contrato" class="form-select">
                    <option value="">-- Seleccionar --</option>
                    {% for tc in ['Nombrado', 'Contratado', 'CAS', 'Locación de Servicios', 'Practicante', 'Independiente'] %}
                        <option value="{{ tc }}">{{ tc }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label small fw-semibold">Fecha de Inicio <span class="text-danger">*</span></label>
                <input type="month" name="fecha_inicio" class="form-control" required>
            </div>

            <div class="col-md-6" id="col-fecha-fin">
                <label class="form-label small fw-semibold">Fecha de Fin</label>
                <input type="month" name="fecha_fin" id="fecha-fin" class="form-control">
            </div>

            <div class="col-12">
                <div class="form-check form-switch">
                    <input type="checkbox" name="es_actual" id="es_actual" class="form-check-input" role="switch">
                    <label class="form-check-label fw-semibold small" for="es_actual">Actualmente me desempeño en este empleo</label>
                </div>
            </div>

            <div class="col-12">
                <label class="form-label small fw-semibold">Funciones o Logros <span class="text-muted">(Opcional)</span></label>
                <textarea name="funciones" class="form-control" rows="2" placeholder="Resumen breve de tus tareas principales..."></textarea>
            </div>
        </div>

        <!-- Un solo botón de guardar que reinicia el flujo -->
        <div class="d-flex justify-content-end mt-4 pt-3 border-top">
            <button type="submit" class="btn btn-primary px-4">
                <i class="bi bi-plus-circle me-1"></i>Guardar y registrar otro
            </button>
        </div>

    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const chkActual = document.getElementById('es_actual');
    const colFin = document.getElementById('col-fecha-fin');
    const inputFin = document.getElementById('fecha-fin');

    function toggleFechaFin() {
        colFin.style.opacity = chkActual.checked ? '0.4' : '1';
        inputFin.disabled = chkActual.checked;
        if (chkActual.checked) inputFin.value = '';
    }

    chkActual.addEventListener('change', toggleFechaFin);
    toggleFechaFin();
});
</script>
{% endblock %}
