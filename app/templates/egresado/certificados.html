{% extends "base.html" %}
{% block titulo %}Formación complementaria{% endblock %}

{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0"><i class="bi bi-patch-check me-2"></i>Formación complementaria</h4>
    <button type="button" class="btn btn-primary btn-sm"
            hx-get="{{ url_for('egresado.certificados_tabla', nuevo=1) }}"
            hx-target="#zona-certificados" hx-swap="innerHTML">
        <i class="bi bi-plus-lg me-1"></i>Nuevo
    </button>
</div>

<div id="zona-certificados" hx-target="#zona-certificados" hx-swap="innerHTML">
    {% include 'egresado/_tabla_certificados.html' %}
</div>

{% endblock %}
