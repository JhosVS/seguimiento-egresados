{% extends "base.html" %}
{% block titulo %}Agregar Certificado{% endblock %}

{% block contenido %}
<div class="container py-3" style="max-width: 750px;">

    <!-- Encabezado con botón pequeño para volver -->
    <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom">
        <h4 class="mb-0 fw-bold"><i class="bi bi-patch-check me-2 text-primary"></i>Agregar Certificado</h4>
        <a href="{{ url_for('egresado.certificados') }}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Ver mis certificados
        </a>
    </div>

    <!-- Alerta informativa -->
    <div class="alert alert-info py-2 small mb-4">
        <i class="bi bi-info-circle me-1"></i>
        Solo son obligatorios el <strong>nombre</strong> y la <strong>institución emisora</strong>. Los demás campos son opcionales.
    </div>

    <!-- Formulario -->
    <form method="POST" action="{{ url_for('egresado.nuevo_certificado') }}" class="card shadow-sm p-4">
        
        <div class="row g-3">
            <!-- Tipo y Categoría -->
            <div class="col-sm-6">
                <label class="form-label small fw-semibold">Tipo <span class="text-danger">*</span></label>
                <select name="tipo" class="form-select" id="tipo-cert" required>
                    <option value="externo">Externo (Coursera, instituto, etc.)</option>
                    <option value="interno">Interno (UNDAC, institucional)</option>
                </select>
            </div>

            <div class="col-sm-6">
                <label class="form-label small fw-semibold">Categoría <span class="text-danger">*</span></label>
                <select name="categoria" class="form-select" id="categoria-cert" required>
                    <option value="curso">Curso</option>
                    <option value="capacitacion">Capacitación</option>
                    <option value="diplomado">Diplomado</option>
                    <option value="idioma">Idioma</option>
                    <option value="otro">Otro</option>
                </select>
            </div>

            <!-- Nivel de idioma condicional -->
            <div class="col-sm-6" id="col-nivel-idioma" style="display: none;">
                <label class="form-label small fw-semibold">Nivel de Idioma</label>
                <select name="nivel_idioma" class="form-select">
                    <option value="">-- Seleccionar --</option>
                    <option value="basico">Básico</option>
                    <option value="intermedio">Intermedio</option>
                    <option value="avanzado">Avanzado</option>
                </select>
            </div>

            <!-- Datos del Certificado -->
            <div class="col-sm-6">
                <label class="form-label small fw-semibold">Nombre del Certificado <span class="text-danger">*</span></label>
                <input type="text" name="nombre" class="form-control" required placeholder="Ej: Python para Ciencia de Datos">
            </div>

            <div class="col-sm-6">
                <label class="form-label small fw-semibold">Institución Emisora <span class="text-danger">*</span></label>
                <input type="text" name="institucion_emisora" class="form-control" required placeholder="Ej: Coursera, SENATI, UNDAC...">
            </div>

            <div class="col-sm-6">
                <label class="form-label small fw-semibold">Fecha de Emisión</label>
                <input type="date" name="fecha_emision" class="form-control">
            </div>

            <div class="col-12">
                <label class="form-label small fw-semibold">URL de Credencial <span class="text-muted fw-normal">(Opcional para certificados digitales)</span></label>
                <input type="url" name="url_credencial" class="form-control" placeholder="https://ejemplo.com/certificado/12345">
            </div>
        </div>

        <!-- Un solo botón de acción continuo -->
        <div class="d-flex justify-content-end mt-4 pt-3 border-top">
            <button type="submit" class="btn btn-primary px-4">
                <i class="bi bi-plus-circle me-1"></i>Guardar y registrar otro
            </button>
        </div>

    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const catCert = document.getElementById('categoria-cert');
    const colIdioma = document.getElementById('col-nivel-idioma');

    function toggleIdioma() {
        colIdioma.style.display = catCert.value === 'idioma' ? 'block' : 'none';
    }

    catCert.addEventListener('change', toggleIdioma);
    toggleIdioma();
});
</script>
{% endblock %}
